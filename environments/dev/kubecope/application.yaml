apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescope
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Image Updater config is NOT here: the ImageUpdater CR sets useAnnotations:
  # false, so these annotations were dead config. See the chart template
  # templates/imageUpdater.yaml.
spec:
  project: default

  source:
    repoURL: https://github.com/dhiman23/OpenkubeScope.git
    targetRevision: dev
    path: environments/dev/kubecope/kubescope-chart

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: openkubescope

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true