tracing:
  # OTLP/HTTP base URL of the trace collector — Jaeger's 4318 port, with NO
  # path: the services append /v1/traces themselves. Set to "" to disable
  # tracing everywhere (the services then skip OTel setup entirely).
  otlpEndpoint: "http://jaeger.default.svc.cluster.local:4318"
  environment: dev

