---
name: code scan merge ci
on:
  pull_request:
    branches:
        - dev
jobs:
    #this is to detect the changes dynamiclly test CI 1
  detect:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 #v4
       with:
          fetch-depth: 0
       #filtering out the duplicate services test 1
     - id: detect
       run: |
        SERVICES=$( git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^services/' | awk -F '/' '{ print $2 }' | sort -u | jq -R . | jq -s -c . )
        echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
    outputs:
        services: ${{ steps.detect.outputs.services }}

  code-scan:
    # in this step we are push the detected servcies to the matrix
    needs: detect
    runs-on: ubuntu-latest
    strategy:
        matrix:
          service: ${{ fromJson(needs.detect.outputs.services) }}

    name: Build & test ${{ matrix.service }}
    if: ${{ needs.detect.outputs.services != '[]' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 #v4
        with:
            fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: 22

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b #v3
        with:
          version: "27.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install dependencies
        run: |
          cd services/${{ matrix.service}}
          npm ci

      - name: Build
        run: |
          cd services/${{matrix.service }}
          npm run build

      - name: Run unit Tests
        run: |
          cd services/${{ matrix.service }}
          npm test

  code-quality:

        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 #v4
          with:
            fetch-depth: 0

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
          env:
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: trivy SBOM
          id: SBOM
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
          with:
            scan-type: 'fs'
            format: cyclonedx
            scan-ref: '.'
            cache: 'false'
            output: 'sbom.cdx.json'

        - name: SBOM scan
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
          with:
            scan-type: 'sbom'
            scan-ref: 'sbom.cdx.json'
            severity: CRITICAL
            exit-code: '1'
            ignore-unfixed: true

        - name: Upload SBOM Artifact
          uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6
          with:
           name: repo-sbom
           path: 'sbom.cdx.json'
